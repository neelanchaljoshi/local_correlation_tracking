# ══════════════════════════════════════════════════════════════════════════════
# LCT Pipeline — Magnetic Feature Tracking Configuration
# Usage: python main.py config/magnetic.ini <year> --month <1-12>
# ══════════════════════════════════════════════════════════════════════════════

[job]
yr_start            = 2010
yr_stop             = 2025
dspan_hours         = 24
dstep_minutes       = 720

[instrument]
# Magnetogram tracking uses magnetogram.fits
segname             = magnetogram.fits
cadence_seconds     = 720
dataset_cadence_seconds = 720
NX                  = 4096
NY                  = 4096
Ntry                = 3
downsample          = 0
interpolate         = 0

[psf]
wavelength_nm       = 617.3
aperture_hmi_m      = 0.14
aperture_pmi_m      = 0.075
pixel_scale_arcsec  = 0.5
psf_size            = 64

[grid]
clat_start          = -60.0
clat_stop           = 60.0
clat_step           = 2.5
clng_start          = -60.0
clng_stop           = 60.0
clng_step           = 2.5

[lct]
patch_size_4k       = 68
patch_size_2k       = 34
pixel_size_4k       = 0.03
pixel_size_2k       = 0.06
alpha               = 0.8
R_sun_Mm            = 695.7
grid_len            = 5
ntry_fit            = 4

[tracking]
change_track        = true
# Hathaway 2011 coefficients [deg/day] for magnetic features
A                   = 14.437
B                   = -1.48
C                   = -2.99
CRrate              = 14.184

[b0_correction]
dI                  = -0.08
t_ref_b0            = 2010-06-07T14:17:20

[paths]
infile_fmt_4k       = /scratch/seismo/joshin/pipeline-test/IterativeLCT/hmi.m_720s/keys-%Y.fits
infile_fmt_2k       = /scratch/seismo/joshin/pipeline-test/IterativeLCT/hmi.m_720s/keys_2k/keys-%Y-2k.fits
rootdir_out         = /data/seismo/joshin/pipeline-test/local_correlation_tracking/data/magnetic
ccf_dir             = /data/seismo/joshin/pipeline-test/local_correlation_tracking/data/magnetic/ccfs

[output]
save_ccf            = 0
ccf_lat_threshold   = 0.1
ccf_lng_threshold   = 0.1
