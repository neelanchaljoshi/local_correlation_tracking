# ══════════════════════════════════════════════════════════════════════════════
# LCT Pipeline — Magnetic Feature Tracking, one day of hourly chunks (range mode)
# Usage:
#   python main_chunk.py config/one_day_hourly.ini --print-nchunks   # -> 24
#   sbatch --array=1-24 run_slurm_chunk.sh config/one_day_hourly.ini
# Chunk N maps straight to hour (N-1) of range_start's day -- no
# day-offset arithmetic needed. year/month are omitted from the CLI
# entirely in range mode; the year is inferred from range_start.
# ══════════════════════════════════════════════════════════════════════════════

[job]
# yr_start/yr_stop are still required by Config but unused by range
# mode itself (validate_range only checks against the fixed HMI
# data-availability floor, May 2010) -- kept consistent with
# magnetic.ini.
yr_start            = 2010
yr_stop             = 2025
# One chunk = one hour of the day; one flow measurement per chunk.
dspan_hours         = 1
dstep_minutes       = 60
# The single day this config covers.
range_start         = 2018-01-01T00:00:00
range_end           = 2018-01-02T00:00:00

[instrument]
# Magnetogram tracking uses magnetogram.fits
segname             = magnetogram.fits
cadence_seconds     = 720
dataset_cadence_seconds = 720
NX                  = 4096
NY                  = 4096
Ntry                = 3
downsample          = 0
interpolate         = 0

[psf]
wavelength_nm       = 617.3
aperture_hmi_m      = 0.14
aperture_pmi_m      = 0.075
pixel_scale_arcsec  = 0.5
psf_size            = 64

[grid]
clat_start          = -90.0
clat_stop           = 90.0
clat_step           = 2.5
clng_start          = -90.0
clng_stop           = 90.0
clng_step           = 2.5

[lct]
patch_size_4k       = 68
patch_size_2k       = 34
pixel_size_4k       = 0.03
pixel_size_2k       = 0.06
alpha               = 0.8
R_sun_Mm            = 695.7
grid_len            = 5
ntry_fit            = 4

[tracking]
change_track        = true
# Hathaway 2011 coefficients [deg/day] for magnetic features
A                   = 14.437
B                   = -1.48
C                   = -2.99
CRrate              = 14.184

[b0_correction]
dI                  = -0.08
t_ref_b0            = 2010-06-07T14:17:20

[paths]
infile_fmt_4k       = /scratch/seismo/joshin/pipeline-test/IterativeLCT/hmi.m_720s/keys_new_swan/keys-%Y.fits
infile_fmt_2k       = /scratch/seismo/joshin/pipeline-test/IterativeLCT/hmi.m_720s/keys_2k/keys-%Y-2k.fits
rootdir_out         = /data/seismo/joshin/pipeline-test/local_correlation_tracking/data/magnetic
ccf_dir             = /data/seismo/joshin/pipeline-test/local_correlation_tracking/data/magnetic/ccfs

[output]
save_ccf            = 0
ccf_lat_threshold   = 0.1
ccf_lng_threshold   = 0.1
