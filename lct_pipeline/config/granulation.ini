# ══════════════════════════════════════════════════════════════════════════════
# LCT Pipeline — Granulation Tracking Configuration
# Usage: python main.py config/granulation.ini <year> --month <1-12>
# ══════════════════════════════════════════════════════════════════════════════

[job]
# Valid data range — pipeline warns and skips if year/month is before May 2010
yr_start            = 2010
yr_stop             = 2025
# Time span and step for LCT windows
dspan_hours         = 24
dstep_minutes       = 45

[instrument]
# Image type: continuum.fits | magnetogram.fits
segname             = continuum.fits
# Observation cadence of raw dataset [seconds]
cadence_seconds     = 45
dataset_cadence_seconds = 45
# Image dimensions (4096x4096 for HMI full-res, 2048x2048 for downsampled)
NX                  = 4096
NY                  = 4096
# Number of FITS read retries before skipping
Ntry                = 3
# Downsample HMI → PMI resolution (0=no, 1=yes)
downsample          = 0
# Interpolate between frames to target cadence (0=no, 1=yes)
interpolate         = 0

[psf]
# Observation wavelength [nm]
wavelength_nm       = 617.3
# Aperture diameters [m]
aperture_hmi_m      = 0.14
aperture_pmi_m      = 0.075
# Pixel scale [arcsec/pixel] — same for HMI and PMI assumed
pixel_scale_arcsec  = 0.5
# PSF kernel size [pixels]
psf_size            = 64

[grid]
# Latitude/longitude sampling grid [degrees]
clat_start          = -90.0
clat_stop           = 90.0
clat_step           = 2.5
clng_start          = -90.0
clng_stop           = 90.0
clng_step           = 2.5

[lct]
# Patch size [pixels] — 68 for 4K (0.03 deg/px), 34 for 2K (0.06 deg/px)
patch_size_4k       = 68
patch_size_2k       = 34
# Pixel scale of remapped image [deg/pixel]
pixel_size_4k       = 0.03
pixel_size_2k       = 0.06
# Tukey window taper fraction
alpha               = 0.8
# Solar radius [Mm]
R_sun_Mm            = 695.7
# Grid length for ellipsoid peak fitting (must be odd)
grid_len            = 5
# Number of iterative refinement steps in peak fitting
ntry_fit            = 4

[tracking]
# Differential rotation correction toggle
change_track        = true
# Snodgrass 1984 B coefficients [deg/day] for granulation
A                   = 14.034
B                   = -1.702
C                   = -2.494
# Carrington rotation rate [deg/day]
CRrate              = 14.184

[b0_correction]
# B0 angle correction parameters
dI                  = -0.08
# Reference time for B0 correction (ISO format)
t_ref_b0            = 2010-06-07T14:17:20

[paths]
# Input keys file — strftime format, %Y replaced by year
infile_fmt_4k       = /scratch/seismo/joshin/pipeline-test/IterativeLCT/hmi.ic_45s/keys_new_swan/keys-%Y.fits
infile_fmt_2k       = /scratch/seismo/joshin/pipeline-test/IterativeLCT/hmi.ic_45s/keys_all_bad_excluded/keys_2k_2k/keys-%Y-2k.fits
# Output root directory
rootdir_out         = /data/seismo/joshin/pipeline-test/pmi_test/supergranular_flow/final_sg_compare/data
# CCF save directory (set to empty string to disable CCF saving)
ccf_dir             = /data/seismo/joshin/pipeline-test/pmi_test/supergranular_flow/final_sg_compare/ccfs/gran

[output]
# Save CCFs for pixels near disk centre (0=no, 1=yes)
save_ccf            = 1
# Lat/lng threshold for CCF saving [degrees]
ccf_lat_threshold   = 0.1
ccf_lng_threshold   = 0.1
