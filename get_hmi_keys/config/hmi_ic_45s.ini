# get_hmi_keys — hmi.ic_45s (Continuum intensity, 45s cadence, granulation tracking)
# Usage: python main.py config/hmi_ic_45s.ini [--year Y]
# outfile_fmt matches lct_pipeline/config/granulation.ini's infile_fmt_4k
# exactly, so keys generated with this config are found without any
# copying/renaming.
# ══════════════════════════════════════════════════════════════════════════════

[job]
yr_start            = 2010
yr_stop             = 2024

[series]
seriesname          = hmi.ic_45s
cadence_seconds     = 45
extra_keys          =

[data_availability]
data_start          = 2010-05-01

[quality]
qbits_pass          = 0x00000000

[paths]
outdir              = /scratch/seismo/joshin/pipeline-test/IterativeLCT/hmi.ic_45s
outfile_fmt         = keys_new_swan/keys-%Y.fits
