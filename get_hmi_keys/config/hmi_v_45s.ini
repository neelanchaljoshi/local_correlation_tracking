# ══════════════════════════════════════════════════════════════════════════════
# get_hmi_keys — hmi.v_45s (Dopplergram, 45s cadence)
# Usage: python main.py config/hmi_v_45s.ini [--year Y]
# Reproduces the values that were previously hardcoded in config.py/main.py.
# ══════════════════════════════════════════════════════════════════════════════

[job]
# Year range to process when --year is not given on the CLI (inclusive)
yr_start            = 2018
yr_stop             = 2018

[series]
seriesname          = hmi.v_45s
cadence_seconds     = 45
# Comma-separated extra DRMS keywords to fetch beyond the required
# baseline (t_rec, t_obs, obs_vr, quality, crpix1/2, crval1/2,
# cdelt1/2, crota2, crln_obs, crlt_obs, rsun_obs) -- leave empty unless
# you need something extra.
extra_keys          =

[data_availability]
# HMI science observations begin 2010-05-01 -- if yr_start/--year is
# 2010, the query window starts here instead of Jan 1. Leave empty for
# series/years with no such cutoff.
data_start          = 2010-05-01

[quality]
# Quality bitmask. A frame passes only if (quality | qbits_pass) ==
# qbits_pass -- 0x00000000 is strictest (only quality==0 passes).
qbits_pass          = 0x00000000

[paths]
# Output root directory -- created automatically if it doesn't exist.
outdir              = /scratch/seismo/joshin/pipeline-test/IterativeLCT/hmi.v_45s
# strftime-format output filename, relative to outdir. Override to
# match whatever subdirectory an lct_pipeline .ini's infile_fmt_4k/2k
# expects, e.g. 'keys_new_swan/keys-%Y.fits'.
outfile_fmt         = keys-%Y.fits
