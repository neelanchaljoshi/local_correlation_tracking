# ══════════════════════════════════════════════════════════════════════════════
# get_hmi_keys — hmi.m_720s (Magnetogram, 720s cadence, magnetic-feature tracking)
# Usage: python main.py config/hmi_m_720s.ini [--year Y]
# outfile_fmt matches lct_pipeline/config/magnetic.ini's infile_fmt_4k
# exactly, so keys generated with this config are found without any
# copying/renaming.
# ══════════════════════════════════════════════════════════════════════════════

[job]
yr_start            = 2010
yr_stop             = 2024

[series]
seriesname          = hmi.m_720s
cadence_seconds     = 720
extra_keys          =

[data_availability]
data_start          = 2010-05-01

[quality]
qbits_pass          = 0x00000000

[paths]
outdir              = /scratch/seismo/joshin/pipeline-test/IterativeLCT/hmi.m_720s
outfile_fmt         = keys_new_swan/keys-%Y.fits
